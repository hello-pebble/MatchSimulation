spring:
  application:
    name: AdminCore
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads
  # 로컬 개발용 PostgreSQL — docker compose up -d db 로 기동한다.
  # 운영/배포 환경에서는 SPRING_DATASOURCE_* 환경변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:5432/admincore
    driver-class-name: org.postgresql.Driver
    username: admincore
    password: admincore
    hikari:
      pool-name: admincore-pool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 소유, Hibernate는 검증만
    open-in-view: false
  cache:
    cache-names: matchStats
    caffeine:
      spec: expireAfterWrite=60s
server:
  port: 8080

# JWT 설정 — 운영 환경에서는 환경변수로 주입 (예: APP_JWT_SECRET)
app:
  jwt:
    secret: local-dev-only-secret-key-change-me-32bytes-min!!
    expiry-minutes: 60
