spring:
  application:
    name: MatchSimulation
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads
  datasource:
    url: jdbc:h2:mem:matchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 소유, Hibernate는 검증만
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 매칭 엔진 선택 — 외부 AI 서버 연동 시 external-ai로 변경
matching:
  engine: local        # local | external-ai
  ai:
    base-url: http://localhost:9090

server:
  port: 8080

# JWT 설정 — 운영 환경에서는 환경변수로 주입 (예: APP_JWT_SECRET)
app:
  jwt:
    secret: local-dev-only-secret-key-change-me-32bytes-min!!
    expiry-minutes: 60
