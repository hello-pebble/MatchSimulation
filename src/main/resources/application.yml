spring:
  application:
    name: AdminHub
  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads
  datasource:
    url: jdbc:h2:mem:adminhubdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 소유, Hibernate는 검증만
    open-in-view: false
  cache:
    cache-names: matchStats
    caffeine:
      spec: expireAfterWrite=60s
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# JWT 설정 — 운영 환경에서는 환경변수로 주입 (예: APP_JWT_SECRET)
app:
  jwt:
    secret: local-dev-only-secret-key-change-me-32bytes-min!!
    expiry-minutes: 60
